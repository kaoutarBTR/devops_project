- name: Configure VM
  hosts: all
  become: yes

  tasks:
    - name: Update system
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run app container
      docker_container:
        name: myapp
        image: myapp:latest
        state: started
        ports:
          - "80:3000"
